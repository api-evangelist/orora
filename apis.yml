name: Orora

description: 'Orora (Orora Group Limited, ASX: ORA) is an Australian-listed packaging company that describes itself as the
  global leader in sustainable glass and aluminium packaging, partnering with major drinks brands. Its roughly 4,500-person
  team runs 17 sites across Australia, North America, Europe and the UAE, covering design, manufacturing and decoration of
  glass bottles and aluminium beverage cans. Orora does not publish a public developer portal or API; this profile was surfaced
  from the australia-apidays-2026 harvest.'

